<!DOCTYPE html>
<html lang="{{HTML_LANG}}" data-page-lang="{{PAGE_LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">

{{HREFLANG_LINKS}}

    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{META_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{CANONICAL_URL}}">
    <meta property="og:locale" content="{{OG_LOCALE}}">
    <meta property="og:image" content="https://www.fazdetudo.pt/logo.webp">

    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="apple-touch-icon" href="/logo.webp">

    <link rel="stylesheet" href="{{ASSET_PREFIX}}style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <script type="application/ld+json">
    {{JSON_LD}}
    </script>
</head>
<body class="service-page">

    <header class="header scrolled" id="header">
        <div class="container header-inner">
            <a href="{{INDEX_HREF}}" class="logo">
                <img src="{{ASSET_PREFIX}}logo.webp" alt="Faz de Tudo PT" class="logo-img">
                <span class="logo-brand">
                    <span class="logo-text">fazdetudo<em>.pt</em></span>
                    <span class="logo-tagline">HANDYMAN</span>
                </span>
            </a>
            <div class="header-actions">
                <a href="{{INDEX_HREF}}" class="service-page-back"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> <span>{{BACK_LABEL}}</span></a>
                <a href="tel:+351932504112" class="btn-phone" id="header-phone">
                    <i class="fa-solid fa-phone"></i>
                    <span>932 504 112</span>
                </a>
            </div>
        </div>
    </header>

    <main class="service-page-main service-page-main--article">
        <article class="container service-article">
            <header class="service-hero">
                <h1 class="service-article-title">{{H1_TITLE}}</h1>
                <p class="service-article-lead">{{LEAD_TEXT}}</p>
            </header>

            <div class="service-layout">
                <div class="service-main-col">
                    <div class="service-rich-text">
                {{BODY_HTML}}
                    </div>
                </div>
                <aside class="service-sidebar">
                    <div class="service-cta-box">
                <h3>{{CTA_H3}}</h3>
                <p>{{CTA_P}}</p>
                <div class="service-cta-box-actions">
                    <a href="https://wa.me/351932504112?text={{WA_TEXT}}" class="btn btn-primary btn-lg" target="_blank" rel="noopener noreferrer">
                        <i class="fa-brands fa-whatsapp"></i> {{CTA_WA}}
                    </a>
                    <a href="tel:+351932504112" class="btn btn-outline btn-lg service-cta-call">
                        <i class="fa-solid fa-phone"></i> {{CTA_CALL}}
                    </a>
                </div>
                    </div>
                </aside>
            </div>
        </article>
    </main>

    <footer class="footer service-page-footer service-page-footer--brand">
        <div class="container">
            <p>{{FOOTER_TEXT}}</p>
        </div>
    </footer>


    <div class="float-contact-dock">
    <!-- WhatsApp Chat Widget -->
    <div class="wa-widget" id="wa-widget">
        <div class="wa-chat" id="wa-chat">
            <div class="wa-chat-header">
                <img src="{{ASSET_PREFIX}}logo.webp" alt="Faz de Tudo PT" class="wa-chat-avatar">
                <div class="wa-chat-info">
                    <strong>Faz de Tudo PT</strong>
                    <span>{{WA_ONLINE}}</span>
                </div>
                <button class="wa-chat-close" id="wa-chat-close" aria-label="{{WA_CLOSE}}">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="wa-chat-body">
                <div class="wa-chat-bubble" id="wa-chat-bubble">
                    <p id="wa-greeting">{{WA_GREETING}}</p>
                    <span class="wa-chat-time" id="wa-chat-time"></span>
                </div>
            </div>
            <div class="wa-chat-footer">
                <input type="text" class="wa-chat-input" id="wa-chat-input" placeholder="{{WA_PLACEHOLDER}}" autocomplete="off">
                <button class="wa-chat-send" id="wa-chat-send" aria-label="{{WA_SEND}}">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
        <button class="whatsapp-float" id="whatsapp-float" aria-label="{{WA_FLOAT_LABEL}}">
            <i class="fa-brands fa-whatsapp" id="wa-icon-open"></i>
            <i class="fa-solid fa-xmark wa-icon-close" id="wa-icon-close"></i>
        </button>
    </div>

    <a href="tel:+351932504112" class="float-call-bar" aria-label="{{FLOAT_TEL}}">
        <i class="fa-solid fa-phone float-call-bar__icon" aria-hidden="true"></i>
        <span class="float-call-bar__number">932 504 112</span>
    </a>
    </div>

    <script src="{{ASSET_PREFIX}}script.js"></script>
</body>
</html>
