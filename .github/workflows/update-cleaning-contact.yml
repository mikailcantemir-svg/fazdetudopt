name: Finalize cleaning contact

on:
  push:
    paths:
      - .github/workflows/update-cleaning-contact.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/update-cleaning-contact-temp.py
      - run: python scripts/generate-servico-pages.py
      - name: Commit changes
        run: |
          rm -f docs/DEBUG-CLEANING-BUILD.txt docs/DEBUG-CLEANING-BUILD-2.txt
          rm .github/workflows/update-cleaning-contact.yml
          rm scripts/update-cleaning-contact-temp.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Caterina with direct call and WhatsApp"
          git push origin HEAD:main
