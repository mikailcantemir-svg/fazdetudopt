name: Update cleaning partner contact

on:
  push:
    paths:
      - '.github/workflows/update-cleaning-contact.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Caterina contact options
        run: |
          echo '' | base64 -d > /tmp/update_cleaning.py
          python /tmp/update_cleaning.py
          python scripts/generate-servico-pages.py
          rm .github/workflows/update-cleaning-contact.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add direct call and WhatsApp for cleaning partner"
          git push origin HEAD:main
