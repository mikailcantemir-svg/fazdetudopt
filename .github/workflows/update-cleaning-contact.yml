name: Update cleaning contact

on:
  push:
    paths:
      - .github/workflows/update-cleaning-contact.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/update-cleaning-contact-temp.py
      - run: python scripts/generate-servico-pages.py
      - name: Commit changes
        run: |
          rm .github/workflows/update-cleaning-contact.yml
          rm scripts/update-cleaning-contact-temp.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Caterina with call and WhatsApp"
          git push origin HEAD:main
# retry after updater fix
