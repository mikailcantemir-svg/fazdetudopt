name: Update cleaning partner contact

on:
  push:
    paths:
      - '.github/workflows/update-cleaning-contact.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Caterina call and WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage cleaning card
          p = Path('scripts/generate-homepages.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Caterina Cantemir', 'Caterina')
          s = s.replace(
              '    "tel_href": "tel:+351963212185",\n    "labels": {',
              '    "tel_href": "tel:+351963212185",\n    "whatsapp_href": "https://wa.me/351963212185",\n    "labels": {'
          )
          s = s.replace('"call": "Ligar diretamente"', '"call": "Ligar"')
          s = s.replace('"call": "Call directly"', '"call": "Call"')
          s = s.replace('"call": "Llamar directamente"', '"call": "Llamar"')
          s = s.replace('"call": "Appeler directement"', '"call": "Appeler"')
          old = '''                f'<strong>{html.escape(CLEANING_PARTNER["phone_display"])}</strong>'
                '</a>'
                '</div>'
'''
          new = '''                f'<strong>{html.escape(CLEANING_PARTNER["phone_display"])}</strong>'
                '</a>'
                f'<a class="cleaning-partner-call cleaning-partner-whatsapp" href="{CLEANING_PARTNER["whatsapp_href"]}" '
                'target="_blank" rel="noopener noreferrer" aria-label="Contactar Caterina por WhatsApp">'
                '<i class="fa-brands fa-whatsapp" aria-hidden="true"></i>'
                '<span>WhatsApp</span>'
                '</a>'
                '</div>'
'''
          if old not in s:
              raise RuntimeError('Homepage cleaning contact block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Cleaning service page: call and WhatsApp both go directly to Caterina
          p = Path('scripts/generate-servico-pages.py')
          s = p.read_text(encoding='utf-8').replace('Caterina Cantemir', 'Caterina')
          replacements = {
              '        "call": "Ligar diretamente à Caterina · 963 212 185",': '        "call": "Ligar à Caterina · 963 212 185",\n        "whatsapp": "WhatsApp da Caterina · 963 212 185",',
              '        "call": "Call Caterina directly · 963 212 185",': '        "call": "Call Caterina · 963 212 185",\n        "whatsapp": "WhatsApp Caterina · 963 212 185",',
              '        "call": "Llamar directamente a Caterina · 963 212 185",': '        "call": "Llamar a Caterina · 963 212 185",\n        "whatsapp": "WhatsApp Caterina · 963 212 185",',
              '        "call": "Appeler Caterina directement · 963 212 185",': '        "call": "Appeler Caterina · 963 212 185",\n        "whatsapp": "WhatsApp Caterina · 963 212 185",',
          }
          for old_text, new_text in replacements.items():
              if old_text not in s:
                  raise RuntimeError(f'Missing CTA text: {old_text}')
              s = s.replace(old_text, new_text, 1)

          old = '''    cta_p = ui["cta_p"].format(service=meta["service_name"])
    cta_call = ui["cta_call"]
    call_href = tel_href()
    if is_cleaning_partner:
        partner_cta = CLEANING_PARTNER_CTA[lang]
        cta_p = partner_cta["text"]
        cta_call = partner_cta["call"]
        call_href = f"tel:{CLEANING_PARTNER_PHONE}"
'''
          new = '''    cta_p = ui["cta_p"].format(service=meta["service_name"])
    cta_call = ui["cta_call"]
    cta_wa = ui["cta_wa"]
    call_href = tel_href()
    wa_link = wa_href_for_message(meta["wa_message"])
    if is_cleaning_partner:
        partner_cta = CLEANING_PARTNER_CTA[lang]
        cta_p = partner_cta["text"]
        cta_call = partner_cta["call"]
        cta_wa = partner_cta["whatsapp"]
        call_href = f"tel:{CLEANING_PARTNER_PHONE}"
        wa_link = "https://wa.me/351963212185"
'''
          if old not in s:
              raise RuntimeError('Service CTA variable block not found')
          s = s.replace(old, new, 1)

          old = '''            "CTA_WA": ui["cta_wa"],
            "CTA_CALL": cta_call,
            "WA_HREF": wa_href_for_message(meta["wa_message"]),
'''
          new = '''            "CTA_WA": cta_wa,
            "CTA_CALL": cta_call,
            "WA_HREF": wa_link,
'''
          if old not in s:
              raise RuntimeError('Service template CTA mapping not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Styling for WhatsApp button
          p = Path('style.css')
          s = p.read_text(encoding='utf-8')
          if '.cleaning-partner-whatsapp {' not in s:
              s += '''\n\n.cleaning-partner-whatsapp {\n    background: #25D366;\n}\n\n.cleaning-partner-whatsapp:hover {\n    background: #1DA851;\n}\n'''
          p.write_text(s, encoding='utf-8')

          # Remove surname from project note too
          doc = Path('docs/CLEANING_PARTNER.md')
          if doc.exists():
              d = doc.read_text(encoding='utf-8').replace('Caterina Cantemir', 'Caterina')
              if 'wa.me/351963212185' not in d:
                  d += '\n- WhatsApp direto: `https://wa.me/351963212185`\n'
              doc.write_text(d, encoding='utf-8')
          PY

          python scripts/generate-servico-pages.py
          rm .github/workflows/update-cleaning-contact.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use Caterina first name with call and WhatsApp"
          git push origin HEAD:main
