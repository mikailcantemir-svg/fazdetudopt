name: Add cleaning partner

on:
  push:
    paths:
      - '.github/workflows/add-cleaning-partner.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add direct cleaning partner contact
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Expected block not found in {path}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Homepage generator: partner config and localized contact card.
          replace_once(
              'scripts/generate-homepages.py',
              '''OG_LOCALE = {
    "pt": "pt_PT",
    "en": "en_GB",
    "es": "es_ES",
    "fr": "fr_FR",
}
''',
              '''OG_LOCALE = {
    "pt": "pt_PT",
