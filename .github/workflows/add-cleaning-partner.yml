name: Add cleaning partner

on:
  push:
    paths:
      - '.github/workflows/add-cleaning-partner.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update cleaning partner contact
        run: |
          python .github/scripts/add-cleaning-partner.py
          python scripts/generate-servico-pages.py
          rm .github/workflows/add-cleaning-partner.yml
          rm .github/scripts/add-cleaning-partner.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add direct cleaning partner contact"
          git push origin HEAD:main
