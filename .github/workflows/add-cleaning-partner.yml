                f'<a class="cleaning-partner-call" href="{CLEANING_PARTNER["tel_href"]}" '
                f'aria-label="{html.escape(labels["aria"], quote=True)}">'
                '<i class="fa-solid fa-phone" aria-hidden="true"></i>'
                f'<span>{html.escape(labels["call"])}</span>'
