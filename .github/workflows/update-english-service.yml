name: One-shot English service update

on:
  push:
    paths:
      - '.github/workflows/update-english-service.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add English-service message
        run: |
          python - <<'PY'
          from pathlib import Path

          pt_old = "⭐ ⭐ ⭐ ⭐ ⭐ Avaliado com 5.0 no Google"
          pt_new = "⭐ ⭐ ⭐ ⭐ ⭐ Avaliado com 5.0 no Google · Atendimento em Português e Inglês"
          en_old = "⭐ ⭐ ⭐ ⭐ ⭐ Rated 5.0 on Google"
          en_new = "⭐ ⭐ ⭐ ⭐ ⭐ Rated 5.0 on Google · Service available in English and Portuguese"
          es_old = "⭐ ⭐ ⭐ ⭐ ⭐ Valorado con 5.0 en Google"
          es_new = "⭐ ⭐ ⭐ ⭐ ⭐ Valorado con 5.0 en Google · Atención disponible en portugués e inglés"
          fr_old = "⭐ ⭐ ⭐ ⭐ ⭐ Noté 5.0 sur Google"
          fr_new = "⭐ ⭐ ⭐ ⭐ ⭐ Noté 5.0 sur Google · Service disponible en portugais et en anglais"

          replacements = {
              "scripts/home_page_i18n.py": [(pt_old, pt_new), (en_old, en_new), (es_old, es_new), (fr_old, fr_new)],
              "script.js": [(pt_old, pt_new), (en_old, en_new), (es_old, es_new), (fr_old, fr_new)],
              "scripts/templates/home.html": [(pt_old, pt_new)],
              "index.html": [(pt_old, pt_new)],
              "en/index.html": [(en_old, en_new)],
              "es/index.html": [(es_old, es_new)],
              "fr/index.html": [(fr_old, fr_new)],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise RuntimeError(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/update-english-service.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/home_page_i18n.py script.js scripts/templates/home.html index.html en/index.html es/index.html fr/index.html .github/workflows/update-english-service.yml
          git commit -m "Add Portuguese and English service availability"
          git push origin HEAD:main
